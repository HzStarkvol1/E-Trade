<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş / Kayıt - E-Trade</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .auth-container {
            max-width: 420px;
            width: 100%;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }
        .nav-tabs {
            border-bottom: 2px solid #edf2f7;
            margin-bottom: 30px !important;
        }
        .nav-tabs .nav-link {
            font-weight: 600;
            color: #a0aec0;
            border: none;
            padding: 12px 0;
            margin-bottom: -2px;
            transition: all 0.3s ease;
        }
        .nav-tabs .nav-link:hover {
            color: #4a5568;
        }
        .nav-tabs .nav-link.active {
            color: #1a202c;
            background: none;
            border-bottom: 2px solid #1a202c;
        }
        .form-label {
            font-weight: 500;
            color: #4a5568;
            font-size: 0.9rem;
        }
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            background-color: #f7fafc;
            transition: all 0.3s;
        }
        .form-control:focus {
            background-color: #ffffff;
            border-color: #cbd5e0;
            box-shadow: 0 0 0 3px rgba(203, 213, 224, 0.3);
        }
        .btn-primary, .btn-success {
            background-color: #1a202c;
            border-color: #1a202c;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary:hover, .btn-success:hover {
            background-color: #2d3748;
            border-color: #2d3748;
            transform: translateY(-1px);
        }
        .brand-title {
            color: #1a202c;
            font-weight: 700;
            font-size: 1.75rem;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }
        .toast-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.7);
            animation: toast-timer 5s linear forwards;
        }
        @keyframes toast-timer {
            0% { width: 100%; }
            100% { width: 0%; }
        }
    </style>
</head>
<body>

<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">
    <div th:if="${successMessage}" class="toast align-items-center text-bg-success border-0 fade-toast position-relative overflow-hidden" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex position-relative z-1">
            <div class="toast-body" th:text="${successMessage}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-progress"></div>
    </div>
    <div th:if="${errorMessage}" class="toast align-items-center text-bg-danger border-0 fade-toast position-relative overflow-hidden" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex position-relative z-1">
            <div class="toast-body" th:text="${errorMessage}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-progress"></div>
    </div>
</div>

<div class="auth-container">
    <div class="brand-title">E-Trade Portalı</div>
    
    <ul class="nav nav-tabs nav-fill" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Giriş Yap</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Kayıt Ol</button>
        </li>
    </ul>

    <div class="tab-content" id="authTabsContent">
        <div class="tab-pane fade show active" id="login" role="tabpanel">
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="login-username" class="form-label">Kullanıcı Adı</label>
                    <input type="text" class="form-control" id="login-username" name="username" required>
                </div>
                
                <div class="mb-3">
                    <label for="login-password" class="form-label">Şifre</label>
                    <input type="password" class="form-control" id="login-password" name="password" required>
                </div>
                
                <div class="mb-4 d-flex justify-content-between">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me">
                        <label class="form-check-label text-muted" style="font-size: 0.9rem;" for="remember-me">Beni Hatırla</label>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100">Giriş Yap</button>
            </form>
        </div>

        <div class="tab-pane fade" id="register" role="tabpanel">
            <form th:action="@{/register}" method="post">
                <div class="mb-3">
                    <label for="register-username" class="form-label">Kullanıcı Adı</label>
                    <input type="text" class="form-control" id="register-username" name="username" required>
                </div>
                
                <div class="mb-4">
                    <label for="register-password" class="form-label">Şifre</label>
                    <input type="password" class="form-control" id="register-password" name="password" required>
                </div>
                
                <button type="submit" class="btn btn-success w-100">Kayıt Ol</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        var toastElList = [].slice.call(document.querySelectorAll('.toast.fade-toast'));
        toastElList.map(function (toastEl) {
            new bootstrap.Toast(toastEl, { delay: 5000 }).show();
        });
    });
</script>
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        var errorMessage = /*[[${errorMessage}]]*/ null;
        var successMessage = /*[[${successMessage}]]*/ null;
        if (errorMessage === "Bu kullanıcı adı zaten kullanımda!" || successMessage === "Kayıt başarılı, giriş yapabilirsiniz!") {
            var registerTab = new bootstrap.Tab(document.getElementById('register-tab'));
            if (registerTab) registerTab.show();
        }
    });
</script>
</body>
</html>
