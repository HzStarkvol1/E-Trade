<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Girişi - E-Trade</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .admin-login-container {
            max-width: 400px;
            width: 100%;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .form-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
        }
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(51, 65, 85, 0.2);
            border-color: #94a3b8;
        }
        .btn-dark {
            background-color: #1e293b;
            border: none;
            padding: 12px;
            border-radius: 8px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .btn-dark:hover {
            background-color: #334155;
        }
        .toast-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.7);
            animation: toast-timer 5s linear forwards;
        }
        @keyframes toast-timer {
            0% { width: 100%; }
            100% { width: 0%; }
        }
    </style>
</head>
<body>

<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">
    <div th:if="${successMessage}" class="toast align-items-center text-bg-success border-0 fade-toast position-relative overflow-hidden" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex position-relative z-1">
            <div class="toast-body" th:text="${successMessage}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-progress"></div>
    </div>
    <div th:if="${errorMessage}" class="toast align-items-center text-bg-danger border-0 fade-toast position-relative overflow-hidden" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex position-relative z-1">
            <div class="toast-body" th:text="${errorMessage}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-progress"></div>
    </div>
</div>

<div class="admin-login-container">
    <h3 class="fw-bold mb-4" style="color: #0f172a; letter-spacing: -0.5px;">Yönetim Paneli</h3>
    <form th:action="@{/admin/login}" method="post">
        <div class="mb-3 text-start">
            <label class="form-label fw-bold">Admin Kullanıcı Adı</label>
            <input type="text" class="form-control" name="username" required>
        </div>
        <div class="mb-4 text-start">
            <label class="form-label fw-bold">Şifre</label>
            <input type="password" class="form-control" name="password" required>
        </div>
        <button type="submit" class="btn btn-dark w-100 fw-bold">Oturum Aç</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        var toastElList = [].slice.call(document.querySelectorAll('.toast.fade-toast'));
        toastElList.map(function (toastEl) {
            new bootstrap.Toast(toastEl, { delay: 5000 }).show();
        });
    });
</script>
</body>
</html>
